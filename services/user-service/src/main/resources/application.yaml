server:
  port: 8081

spring:
  config:
    import:
      # Load variables from this module's .env (run from module dir or from project root)
      - optional:file:.env[.properties]
      - optional:file:services/user-service/.env[.properties]
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
    # IP in the ID: several instances on the same port (docker compose --scale) stay distinct in Eureka.
    instance-id: ${EUREKA_INSTANCE_ID:${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}}

logging:
  pattern:
    # Correlation ID of the request (X-Correlation-Id) in every log line
    correlation: '[cid=%X{correlationId:-} trace=%X{traceId:-}] '

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # Every request is traced (demo). Lower it in production (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  # Same setting under its Spring Boot 3 name (ignored if unknown).
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      # Every metric carries the service name (Grafana filter).
      application: ${spring.application.name}
