server:
  port: 8086

spring:
  config:
    import:
      # Load variables from this module's .env (run from module dir or from project root)
      - optional:file:.env[.properties]
      - optional:file:services/payment-service/.env[.properties]
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Trace context in Kafka headers: the consumer span joins the producer's trace.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Broker down / topic missing: send() gives up after 5s (Kafka default 60s, x50 messages per batch).
        max.block.ms: 5000
        request.timeout.ms: 4000
        # Stops retrying before the relay stops waiting (publish-timeout-ms 15s): no hidden late duplicate.
        delivery.timeout.ms: 8000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# PayOS credentials come from the environment (.env locally). Never commit real keys.
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  payment-expiration-minutes: ${PAYOS_PAYMENT_EXPIRATION_MINUTES:15}
  connect-timeout-ms: 5000
  read-timeout-ms: 15000

payment:
  kafka:
    payment-commands: payment-commands
    payment-events: payment-events
    partitions: 3
  scheduling:
    enabled: true
  expiration-batch-size: 100
  expiration-scan-delay-ms: 60000
  expiration-scan-initial-delay-ms: 60000
  # Lost-webhook safety net: PENDING payments older than min-age are checked against PayOS.
  reconcile:
    delay-ms: 60000
    initial-delay-ms: 30000
    min-age-seconds: 60
    batch-size: 50
  outbox:
    relay-delay-ms: 10000
    relay-initial-delay-ms: 1000
    batch-size: 50
    # Temporary error (broker down, topic missing): PENDING again after 5s, 10s, 20s ... max 5 min, never FAILED;
    # logged as ERROR from attempt max-attempts on. Permanent error (no permission, record too large): FAILED.
    # GET /api/v1/payments/admin/outbox, POST /api/v1/payments/admin/outbox/requeue-failed
    max-attempts: 10
    publish-timeout-ms: 15000
    retry-delay-ms: 5000
    max-retry-delay-ms: 300000
    stale-publishing-timeout-ms: 120000

logging:
  pattern:
    # Correlation ID of the request (X-Correlation-Id) in every log line
    correlation: '[cid=%X{correlationId:-} trace=%X{traceId:-}] '
  level:
    com.mv.paymentservice: DEBUG
    org.springframework.web: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
    # IP in the ID: several instances on the same port (docker compose --scale) stay distinct in Eureka.
    instance-id: ${EUREKA_INSTANCE_ID:${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # Every request is traced (demo). Lower it in production (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  # Same setting under its Spring Boot 3 name (ignored if unknown).
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      # Every metric carries the service name (Grafana filter).
      application: ${spring.application.name}
