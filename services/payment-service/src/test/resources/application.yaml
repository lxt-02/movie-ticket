spring:
  datasource:
    url: jdbc:h2:mem:payment_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # No broker in unit tests: do not start the payment-commands consumer.
      auto-startup: false
    admin:
      auto-create: false

payos:
  client-id: test-client
  api-key: test-api-key
  checksum-key: test-checksum-key

payment:
  scheduling:
    enabled: false

eureka:
  client:
    enabled: false
