spring:
  datasource:
    url: jdbc:h2:mem:movie_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      # No broker in tests: do not try to create movie-events.
      auto-create: false

movie:
  scheduling:
    enabled: false
  search:
    sync-on-startup: false
