server:
  port: 8085

spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:postgresql://localhost:5432/movie_booking_movie
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.mv.movieservice: DEBUG
    org.springframework.web: INFO
