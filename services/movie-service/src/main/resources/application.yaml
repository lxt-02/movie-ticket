server:
  port: 8085

spring:
  config:
    import:
      # Load variables from this module's .env (run from module dir or from project root)
      - optional:file:.env[.properties]
      - optional:file:services/movie-service/.env[.properties]
  application:
    name: movie-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Movie events -> topic movie-events (outbox relay); consumed by search-service (Elasticsearch).
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

movie:
  kafka:
    movie-events: ${MOVIE_EVENTS_TOPIC:movie-events}
    relay-delay-ms: 2000
  search:
    # Re-send every movie to search-service when movie-service starts (fills an empty index; idempotent).
    sync-on-startup: ${MOVIE_SEARCH_SYNC_ON_STARTUP:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
    # IP in the ID: several instances on the same port (docker compose --scale) stay distinct in Eureka.
    instance-id: ${EUREKA_INSTANCE_ID:${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}}

logging:
  pattern:
    # Correlation ID of the request (X-Correlation-Id) in every log line
    correlation: '[cid=%X{correlationId:-} trace=%X{traceId:-}] '
  level:
    com.mv.movieservice: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # Every request is traced (demo). Lower it in production (e.g. 0.1).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  # Same setting under its Spring Boot 3 name (ignored if unknown).
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      # Every metric carries the service name (Grafana filter).
      application: ${spring.application.name}
