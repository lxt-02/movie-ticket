server:
  port: 8082

spring:
  config:
    import:
      # Load variables from this module's .env (run from module dir or from project root)
      - optional:file:.env[.properties]
      - optional:file:services/showtime-service/.env[.properties]
  application:
    name: showtime-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

clients:
  movie:
    base-url: ${MOVIE_SERVICE_URL}
  cinema:
    base-url: ${CINEMA_SERVICE_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

showtime:
  schedule:
    # Minimum gap between two showtimes of the same screen (cleaning, ads, entry/exit).
    cleaning-buffer-minutes: 15
