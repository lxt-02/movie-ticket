# Prometheus scrapes every instance registered in Eureka (so `docker compose --scale` instances are found
# automatically) on /actuator/prometheus.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka:8761/eureka
        refresh_interval: 15s
    relabel_configs:
      # application = service name in Eureka (MOVIE-SERVICE -> movie-service)
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
